# Builds the React app on every push to main and publishes it to the gh-pages branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      # Project pages live at /<repo-name>/, so assets need that prefix.
      # There's no API server on Pages, so build:mock uses the in-browser mock data (src/api/mockScript.js).
      - run: npm run build:mock -- --base=/${{ github.event.repository.name }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: my-app/dist
